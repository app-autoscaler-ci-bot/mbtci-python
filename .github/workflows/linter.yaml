name: reviewdog
on: [pull_request]
jobs:
  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: hadolint
        uses: reviewdog/action-hadolint@1df92335c6c70880e301926d46148aeb27de1912 # v1
        with:
          reporter: github-pr-review
